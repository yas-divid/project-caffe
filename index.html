<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café Luna · Melilla</title>
<meta name="description" content="Café Luna en Melilla: desayunos, café de especialidad y repostería casera.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* ====== COLORES: cambia estos 3 para adaptar el estilo a cada cliente ====== */
    --primary:#6b3e26;      /* color principal (marrón café) */
    --accent:#d99a4e;       /* color de acento (botones, detalles) */
    --bg:#fbf6ef;           /* fondo general */
    /* ========================================================================== */
    --ink:#2a1d15;
    --muted:#7a6a5e;
    --card:#ffffff;
    --line:#eadfd1;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15}
  a{color:inherit}
  .wrap{width:100%;max-width:960px;margin:0 auto;padding:0 20px}
  section{padding:56px 0}
  h2{font-size:clamp(1.7rem,5vw,2.3rem);color:var(--primary);margin-bottom:8px}
  .sub{color:var(--muted);margin-bottom:28px}

  /* Barra superior */
  header{position:sticky;top:0;z-index:20;background:rgba(251,246,239,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:60px}
  .logo{font-family:Fraunces,serif;font-weight:700;font-size:1.25rem;color:var(--primary);text-decoration:none}
  .nav a.link{font-size:.9rem;font-weight:500;text-decoration:none;color:var(--muted);margin-left:16px}
  .nav a.link:hover{color:var(--primary)}
  @media(max-width:520px){.nav a.link.hide-sm{display:none}}

  /* Portada */
  .hero{padding:0}
  .hero-inner{position:relative;min-height:78vh;display:flex;align-items:center;color:#fff;
    background:linear-gradient(135deg,var(--primary),#2a1d15);background-size:cover;background-position:center}
  .hero-inner::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.65))}
  .hero-inner .wrap{position:relative}
  .eyebrow{display:inline-block;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:14px}
  .hero h1{font-size:clamp(2.4rem,9vw,4.2rem);margin-bottom:14px}
  .hero p{max-width:520px;font-size:1.08rem;opacity:.92;margin-bottom:26px}
  .btns{display:flex;flex-wrap:wrap;gap:12px}
  .btn{display:inline-block;padding:13px 22px;border-radius:999px;font-weight:600;font-size:.95rem;text-decoration:none;transition:transform .15s}
  .btn:active{transform:scale(.97)}
  .btn-main{background:var(--accent);color:#2a1d15}
  .btn-ghost{border:1.5px solid rgba(255,255,255,.7);color:#fff}

  /* Carta */
  .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:20px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;padding:9px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font:inherit;font-size:.9rem;font-weight:500;color:var(--muted);cursor:pointer}
  .tab.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .items{display:grid;gap:12px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;justify-content:space-between;gap:16px}
  .item h3{font-family:Inter,sans-serif;font-size:1rem;font-weight:600;margin-bottom:2px}
  .item p{font-size:.88rem;color:var(--muted)}
  .item-photo{width:76px;height:76px;object-fit:cover;border-radius:12px;flex:none}
  .item-main{display:flex;align-items:center;gap:14px;min-width:0;flex:1}
  .price{font-weight:600;color:var(--primary);white-space:nowrap}
  @media(min-width:700px){.items{grid-template-columns:1fr 1fr}}

  /* Galería */
  .gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .gallery div{aspect-ratio:1;border-radius:var(--radius);background:linear-gradient(135deg,var(--accent),var(--primary));background-size:cover;background-position:center}
  @media(min-width:700px){.gallery{grid-template-columns:repeat(3,1fr)}}

  /* Info */
  .info{display:grid;gap:20px}
  @media(min-width:760px){.info{grid-template-columns:1fr 1.2fr}}
  .box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
  .box h3{font-size:1.15rem;color:var(--primary);margin-bottom:10px}
  .hours{list-style:none}
  .hours li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.93rem}
  .hours li:last-child{border:0}
  .box p{font-size:.95rem;margin-bottom:6px}
  .map{width:100%;height:100%;min-height:280px;border:0;border-radius:var(--radius)}

  footer{background:var(--primary);color:#f3e7d8;text-align:center;padding:32px 20px;font-size:.9rem}
  footer a{color:var(--accent);text-decoration:none;font-weight:600}

  /* Botón flotante de WhatsApp */
  .wa{position:fixed;right:16px;bottom:16px;z-index:30;background:#25d366;color:#fff;width:56px;height:56px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.25);text-decoration:none}
  .wa svg{width:30px;height:30px;fill:#fff}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="#inicio" class="logo" id="logo"></a>
    <nav>
      <a class="link" href="#carta">Carta</a>
      <a class="link hide-sm" href="#galeria">Galería</a>
      <a class="link" href="#contacto">Dónde estamos</a>
    </nav>
  </div>
</header>

<section class="hero" id="inicio">
  <div class="hero-inner" id="heroBox">
    <div class="wrap">
      <span class="eyebrow" id="eyebrow"></span>
      <h1 id="title"></h1>
      <p id="slogan"></p>
      <div class="btns">
        <a class="btn btn-main" href="#carta">Ver la carta</a>
        <a class="btn btn-ghost" id="heroWa" href="#" target="_blank" rel="noopener">Escríbenos</a>
      </div>
    </div>
  </div>
</section>

<section id="carta">
  <div class="wrap">
    <h2>Nuestra carta</h2>
    <p class="sub">Hecho al momento, con ingredientes de calidad.</p>
    <div class="tabs" id="tabs"></div>
    <div class="items" id="items"></div>
  </div>
</section>

<section id="galeria" style="padding-top:0">
  <div class="wrap">
    <h2>Nuestro rincón</h2>
    <p class="sub">Un vistazo al local y a lo que preparamos.</p>
    <div class="gallery" id="gallery"></div>
  </div>
</section>

<section id="contacto" style="padding-top:0">
  <div class="wrap">
    <h2>Dónde estamos</h2>
    <p class="sub">Te esperamos.</p>
    <div class="info">
      <div class="box">
        <h3>Horario</h3>
        <ul class="hours" id="hours"></ul>
        <h3 style="margin-top:18px">Contacto</h3>
        <p id="address"></p>
        <p id="phone"></p>
        <p id="insta"></p>
      </div>
      <iframe class="map" id="map" loading="lazy" title="Mapa" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>
</section>

<footer>
  <p id="foot"></p>
</footer>

<a class="wa" id="waFloat" href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
  <svg viewBox="0 0 32 32"><path d="M16 3C9 3 3.4 8.6 3.4 15.5c0 2.3.6 4.4 1.7 6.3L3 29l7.4-2c1.8 1 3.800 1.500 5.600 1.500 6.900 0 12.600-5.600 12.600-12.500S22.900 3 16 3zm0 22.800c-1.800 0-3.500-.5-5-1.400l-.4-.2-4.400 1.200 1.200-4.300-.3-.4a10 10 0 01-1.500-5.300C5.600 9.900 10.300 5.300 16 5.300s10.400 4.600 10.400 10.200S21.700 25.800 16 25.800zm5.700-7.500c-.3-.2-1.800-.9-2.100-1-.3-.1-.5-.2-.7.200-.2.300-.8 1-.9 1.200-.2.200-.3.200-.6.100a8.300 8.300 0 01-4.100-3.600c-.3-.5.300-.5.900-1.600.1-.2 0-.4 0-.5l-1-2.300c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.100-.8.400-.3.300-1.100 1.100-1.100 2.600s1.100 3 1.300 3.200c.2.200 2.200 3.400 5.400 4.700 2 .8 2.800.9 3.800.7.600-.1 1.800-.7 2.100-1.500.3-.7.300-1.300.2-1.500-.1-.2-.3-.3-.6-.4z"/></svg>
</a>

<script>
/* =====================================================================
   ✏️  EDITA SOLO ESTA PARTE PARA CADA CLIENTE  ✏️
   Todo lo demás se actualiza solo.
   ===================================================================== */
const CONFIG = {
  nombre: "Café Luna",
  etiqueta: "Melilla · Desde 2015",
  eslogan: "Desayunos, café de especialidad y repostería casera para empezar bien el día.",

  // Foto de portada (pon el nombre del archivo, p. ej. "img/portada.jpg"). Déjalo "" para usar el degradado.
  fotoPortada: "",

  // Galería: lista de fotos (p. ej. "img/1.jpg"). Con [] se muestran bloques de color.
  fotos: [],

  whatsapp: "34600000000",          // con prefijo 34, SIN + ni espacios
  telefono: "600 000 000",
  instagram: "cafeluna_melilla",    // sin @
  direccion: "Calle Ejemplo 12, 52001 Melilla",

  horario: [
    ["Lunes – Viernes", "7:30 – 22:00"],
    ["Sábado", "8:30 – 23:00"],
    ["Domingo", "9:00 – 15:00"]
  ],

  carta: {
    "Desayunos": [
      ["Tostada con tomate y aceite", "Pan artesano, tomate rallado", "2,20 €"],
      ["Tostada con jamón", "Jamón serrano y AOVE", "3,20 €"],
      ["Desayuno completo", "Café + zumo + tostada", "4,50 €"]
    ],
    "Cafés": [
      ["Café solo", "", "1,30 €"],
      ["Café con leche", "", "1,60 €"],
      ["Capuchino", "Con espuma cremosa", "2,20 €"],
      ["Té e infusiones", "Variedad de sabores", "1,80 €"]
    ],
    "Dulces": [
      ["Tarta casera del día", "Pregunta por la de hoy", "3,50 €"],
      ["Croissant", "Mantequilla, recién hecho", "1,80 €"],
      ["Tortita con miel", "", "3,80 €"]
    ],
    "Bocadillos": [
      ["Bocadillo de tortilla", "", "3,50 €"],
      ["Pollo y queso", "", "4,20 €"],
      ["Vegetal", "Lechuga, tomate, atún, huevo", "4,00 €"]
    ]
  }
};
/* ===================================================================== */

(function(){
  const $ = id => document.getElementById(id);
  const C = CONFIG;
  document.title = C.nombre + " · Melilla";
  $("logo").textContent = C.nombre;
  $("eyebrow").textContent = C.etiqueta;
  $("title").textContent = C.nombre;
  $("slogan").textContent = C.eslogan;
  if (C.fotoPortada) $("heroBox").style.backgroundImage = "url('" + C.fotoPortada + "')";

  const wa = "https://wa.me/" + C.whatsapp + "?text=" + encodeURIComponent("Hola, quería información.");
  $("heroWa").href = wa; $("waFloat").href = wa;

  // Carta: carga los productos guardados desde Pages CMS.
  // Si el archivo aún no existe o está vacío, usa la carta de ejemplo de CONFIG.
  const tabs = $("tabs"), items = $("items");

  function normalizeProducts(rows){
    if (!Array.isArray(rows)) return null;
    const grouped = {};
    rows.forEach(product => {
      if (!product || !product.name) return;
      const category = product.category || "Otros";
      if (!grouped[category]) grouped[category] = [];
      const rawPrice = product.price;
      const price = (rawPrice === "" || rawPrice == null)
        ? ""
        : (typeof rawPrice === "number"
            ? rawPrice.toLocaleString("es-ES", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " €"
            : String(rawPrice));
      grouped[category].push({
        name: String(product.name),
        description: product.description ? String(product.description) : "",
        price,
        image: product.image ? String(product.image) : ""
      });
    });
    return Object.keys(grouped).length ? grouped : null;
  }

  function renderMenu(menu){
    tabs.innerHTML = "";
    const cats = Object.keys(menu);
    if (!cats.length) {
      items.textContent = "Pronto publicaremos nuestra carta.";
      return;
    }

    function show(cat){
      [...tabs.children].forEach(b => b.classList.toggle("on", b.textContent === cat));
      items.innerHTML = "";
      (menu[cat] || []).forEach(product => {
        const el = document.createElement("div");
        el.className = "item";

        const left = document.createElement("div");
        left.className = "item-main";

        if (product.image) {
          const img = document.createElement("img");
          img.className = "item-photo";
          img.src = product.image;
          img.alt = product.name || "Producto";
          img.loading = "lazy";
          left.appendChild(img);
        }

        const details = document.createElement("div");
        const h = document.createElement("h3");
        h.textContent = product.name || "";
        details.appendChild(h);

        if (product.description) {
          const desc = document.createElement("p");
          desc.textContent = product.description;
          details.appendChild(desc);
        }
        left.appendChild(details);

        const price = document.createElement("div");
        price.className = "price";
        price.textContent = product.price || "";
        el.append(left, price);
        items.appendChild(el);
      });
    }

    cats.forEach(category => {
      const button = document.createElement("button");
      button.className = "tab";
      button.type = "button";
      button.textContent = category;
      button.addEventListener("click", () => show(category));
      tabs.appendChild(button);
    });
    show(cats[0]);
  }

  fetch("data/products.json")
    .then(response => {
      if (!response.ok) throw new Error("No se pudo cargar data/products.json");
      return response.json();
    })
    .then(rows => renderMenu(normalizeProducts(rows) || CONFIG.carta))
    .catch(() => renderMenu(CONFIG.carta));

  // Galería
  const g = $("gallery");
  const n = Math.max(C.fotos.length, 6);
  for (let i = 0; i < n; i++){
    const d = document.createElement("div");
    if (C.fotos[i]) d.style.backgroundImage = "url('" + C.fotos[i] + "')";
    else d.style.opacity = (0.55 + (i % 3) * 0.15);
    g.appendChild(d);
  }

  // Horario y contacto
  C.horario.forEach(([a, b]) => {
    const li = document.createElement("li");
    const s1 = document.createElement("span"); s1.textContent = a;
    const s2 = document.createElement("strong"); s2.textContent = b;
    li.append(s1, s2); $("hours").appendChild(li);
  });
  $("address").textContent = "📍 " + C.direccion;
  $("phone").innerHTML = "📞 <a href='tel:" + C.telefono.replace(/\s/g,"") + "'>" + C.telefono + "</a>";
  $("insta").innerHTML = "📷 <a target='_blank' rel='noopener' href='https://instagram.com/" + C.instagram + "'>@" + C.instagram + "</a>";
  $("map").src = "https://www.google.com/maps?q=" + encodeURIComponent(C.direccion) + "&output=embed";
  $("foot").innerHTML = "© " + new Date().getFullYear() + " " + C.nombre + " · Melilla";
})();
</script>
</body>
</html>
